<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ユーザー管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header class="topbar">
      <span class="username">{{ g.user.username }}</span>
      <nav class="topbar-nav">
        <a href="{{ url_for('index') }}">TODOへ戻る</a>
      </nav>
      <form action="{{ url_for('logout') }}" method="post" class="logout-form">
        <button type="submit">ログアウト</button>
      </form>
    </header>

    <h1>ユーザー管理</h1>

    {% if error %}
    <p class="flash-error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('create_user') }}" method="post" class="auth-form">
      <label>
        ユーザー名
        <input type="text" name="username" required>
      </label>
      <label>
        パスワード
        <input type="password" name="password" required minlength="4">
      </label>
      <button type="submit">ユーザーを追加</button>
    </form>

    <div class="user-table-wrapper">
      <table class="user-table">
        <thead>
          <tr>
            <th>ユーザー名</th>
            <th>権限</th>
            <th>作成日時</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user.username }}</td>
            <td>
              {% if user.is_admin %}
              <span class="admin-badge">管理者</span>
              {% else %}
              一般
              {% endif %}
            </td>
            <td>{{ user.created_at }}</td>
            <td>
              {% if not user.is_admin %}
              <form action="{{ url_for('delete_user', user_id=user.id) }}" method="post"
                    class="delete-form" onsubmit="return confirm('このユーザーを削除します。よろしいですか？');">
                <button type="submit" class="delete-btn" aria-label="削除">✕</button>
              </form>
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
